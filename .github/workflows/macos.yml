name: Build desktop releases

on:
  push:
    branches: [main]
    paths:
      - "app.py"
      - "processor.py"
      - "requirements.txt"
      - "ui/index.html"
      - "version.py"
      - "README.md"
      - "LICENSE"
      - "build_macos.sh"
      - "build.ps1"
      - ".github/workflows/macos.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build app bundle and zip
        run: bash build_macos.sh
      - name: Upload macOS build
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            releases/星点柔焦-v*-macos-${{ matrix.arch }}.zip
            releases/星点柔焦-v*-macos-${{ matrix.arch }}.zip.sha256
          if-no-files-found: error
          retention-days: 30

  build-windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build executable and zip
        shell: pwsh
        run: .\build.ps1
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: releases/星点柔焦-v*-win-x64.zip
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish versioned release assets
    needs: [build, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Download macOS builds
        uses: actions/download-artifact@v4
        with:
          pattern: macos-*
          merge-multiple: true
          path: release-source
      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: windows-source
      - name: Add Windows build and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^APP_VERSION = "\([^"]*\)"/\1/p' version.py)"
          tag="v${version}"
          mkdir -p release-assets
          for arch in arm64 x64; do
            source_zip="$(find release-source -maxdepth 1 -type f -name "*-macos-${arch}.zip" -print -quit)"
            test -n "$source_zip"
            cp "$source_zip" "release-assets/starsoft-v${version}-macos-${arch}.zip"
          done
          windows_zip="$(find windows-source -maxdepth 1 -type f -name "*-win-x64.zip" -print -quit)"
          test -n "$windows_zip"
          cp "$windows_zip" "release-assets/starsoft-v${version}-win-x64.zip"
          (
            cd release-assets
            for asset in *.zip; do shasum -a 256 "$asset" > "$asset.sha256"; done
          )
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release-assets/* --clobber
          else
            gh release create "$tag" release-assets/* \
              --target "$GITHUB_SHA" \
              --title "星点柔焦 ${version}" \
              --notes "Windows、macOS Apple 芯片与 Intel 版本。macOS 包目前未使用 Apple Developer ID 签名或公证。"
          fi
